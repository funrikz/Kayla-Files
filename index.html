<!DOCTYPE html>
<html>
<head>
    <title>kayla files</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
            background: #f8f9fa;
        }

        h1 {
            color: #2c3e50;
        }

        input, textarea {
            width: 70%;
            max-width: 900px;
            padding: 12px;
            margin: 12px auto;
            display: block;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
            background: #fff;
        }

        button {
            padding: 12px 28px;
            font-size: 17px;
            cursor: pointer;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            margin: 10px;
        }

        button:hover {
            background: #2980b9;
        }

        #detailsPage {
            display: none;
            margin-top: 30px;
        }

        #displayContent {
            font-family: Georgia, serif;
            background: #fdfdfd;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 24px;
            margin: 20px auto;
            max-width: 960px;
            min-height: 400px;
            text-align: left;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 17px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <!-- MAIN PAGE -->
    <div id="mainPage">
        <h1>Create a Post</h1>

        <input type="text" id="titleInput" placeholder="kayla files">

        <textarea id="contentInput" rows="18">
IN THE SUPERIOR COURT OF California
COUNTY OF San Bernardino

The State of California
v.
Kayla Files
Defendant

Case No. 2026-CR-23493

INDICTMENT

The Grand Jury of Pink Sprinkles, State of California, charges the Defendant with the following offenses:

Count 1: Illegal Distribution of Controlled Substances
In violation of State Code 144, the Defendant knowingly distributed unlawful narcotics.

Count 2–4: Sexual Assault (3 Counts)
In violation of State Code 132, the Defendant engaged in non-consensual acts with victims identified through witness testimony.

Count 5: Hate Crime
In violation of State Code 129, the Defendant committed a criminal offense motivated by bias against a protected group.

Count 6: Child Exploitation / Trafficking
In violation of State Code 1992, the Defendant knowingly engaged in unlawful trafficking of a minor.

Count 7: Criminal Organization / Cult Affiliation
In violation of State Code 14, the Defendant participated in an organized criminal enterprise.

Count 8: Aggravated Harassment
In violation of State Code 349, the Defendant engaged in repeated threatening behavior toward victims.

JURY VERDICT

After presentation of evidence and witness testimony, the jury finds the Defendant:

GUILTY on all counts.

SENTENCING

For Counts 1–8:
Life Imprisonment without the possibility of parole.

Additionally:
50 years of solitary confinement, to run consecutively.
        </textarea>

        <button onclick="goToDetails()">View Document</button>
    </div>


    <!-- DETAILS PAGE (read-only view) -->
    <div id="detailsPage">
        <h1 id="displayTitle"></h1>

        <!-- Using readonly textarea for long content + clear "cannot edit" feeling -->
        <textarea id="displayContent" 
                  readonly 
                  rows="30"></textarea>

        <br>
        <button onclick="goBack()">← Back to Edit</button>
    </div>


<script>
function goToDetails() {
    const title = document.getElementById("titleInput").value.trim() || "Untitled Document";
    const content = document.getElementById("contentInput").value;

    document.getElementById("displayTitle").innerText = title;
    document.getElementById("displayContent").value = content;

    document.getElementById("mainPage").style.display = "none";
    document.getElementById("detailsPage").style.display = "block";
}

function goBack() {
    document.getElementById("detailsPage").style.display = "none";
    document.getElementById("mainPage").style.display = "block";
}
</script>

</body>
</html>
